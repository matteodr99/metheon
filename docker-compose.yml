services:
  postgres:
    image: postgres:16
    container_name: metheon-postgres
    environment:
      POSTGRES_DB: metheon
      POSTGRES_USER: metheon
      POSTGRES_PASSWORD: metheon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data: