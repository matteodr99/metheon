name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: metheon
          POSTGRES_USER: metheon
          POSTGRES_PASSWORD: metheon
        ports:
          - 5432:5432
        # Without this the steps can start before the server accepts
        # connections, and the database tests would error on a race.
        options: >-
          --health-cmd "pg_isready -U metheon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: metheon
      POSTGRES_USER: metheon
      POSTGRES_PASSWORD: metheon

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Read from .python-version, so CI and a developer machine cannot
          # disagree about the interpreter — the same arrangement as .nvmrc.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        # GitHub sets CI=true, which turns a missing database from a skip
        # into a failure: see backend/tests/conftest.py.
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc, so CI and a developer machine cannot disagree
          # about the version.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and the lockfile have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Backend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build -t metheon-backend ./backend

      - name: Check both entrypoints import with runtime dependencies only
        # The image installs requirements.txt, while the tests run with the
        # larger requirements-dev.txt. Importing both entrypoints inside the
        # image is what catches a dependency that exists only in the
        # development set, or a file the Dockerfile forgot to copy.
        run: docker run --rm metheon-backend python -c "import app.main, app.worker"

      - name: Check the image runs as an unprivileged user
        run: |
          user=$(docker run --rm metheon-backend id -u)
          test "$user" != "0" || { echo "::error::the image runs as root"; exit 1; }

      - name: Check the default command starts the API
        # The CMD, the host binding and the port are image-specific and
        # covered nowhere else. Liveness needs no database, so this is a
        # clean check of "uvicorn came up on 8000".
        run: |
          docker run -d --rm --name api -p 8000:8000 metheon-backend
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health/live \
            || { docker logs api; echo "::error::the API did not come up"; exit 1; }
          docker stop api >/dev/null
