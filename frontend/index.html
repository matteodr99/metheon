<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metheon</title>
    <meta name="description" content="Public natural-event data, agency by agency: earthquake catalogues and disaster alerts from four agencies in one schema, filtered, mapped and compared." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Metheon — public natural-event data, agency by agency" />
    <meta property="og:description" content="Earthquake catalogues and disaster alerts from four public agencies in one schema: filtered, mapped and compared, with the same earthquake shown at three magnitudes." />
    <meta property="og:url" content="https://metheon.pages.dev/" />
    <meta property="og:image" content="https://metheon.pages.dev/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    <script>
      // Runs before the first paint, so a dark-theme user never sees a white
      // flash while React boots.
      try {
        var stored = localStorage.getItem('metheon:theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored)
          document.documentElement.style.colorScheme = stored
        }
      } catch (error) {
        /* storage blocked: fall through to the system preference */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
