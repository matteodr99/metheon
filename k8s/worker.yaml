# The worker: same image as the API, different command. No Service — it
# talks to Redis and Postgres and nobody talks to it. No liveness probe
# either: it serves no HTTP, and a stuck run is the reaper's job, not the
# kubelet's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: metheon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: metheon-backend
          imagePullPolicy: Never
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: metheon-config
            - secretRef:
                name: metheon-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
